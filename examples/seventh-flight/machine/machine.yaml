# Second light: the Deku Tree on 0.2.1 — flying the clarification pass.
# Boot into the save, then stand watch while AJ walks Link (no pad held).
# Two reflexes exercise the ratified absence semantics against the real
# game:
#   unfamiliar-enemy — bare `not in` over a possibly-absent entity. The
#     0.2.1 fix means it stays SILENT in empty rooms and fires only when
#     an enemy outside the official vocabulary is actually in view (it
#     doubles as a live vocabulary-gap detector).
#   overhead-lurker — dist/above conjunction; the `above` sign's third
#     outing, now positive-up, and absence must hold the guard False.
version: 1
initial: boot

nodes:
  boot:
    behavior: boot_from_title_v1
    transitions:
      - name: booted
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal save file loaded, standing watch
          - goto stand_watch
      - name: boot-retry
        on: behavior_done
        do: goto boot
  stand_watch:
    behavior: stand_watch_v1
    transitions:
      - name: keep-watching
        on: behavior_done
        do: goto stand_watch
  explore_room:
    behavior: wander_scan_v2
    transitions:
      # The MACHINE.md example pattern, live: wander until a baba is in
      # reach, then hand off to the graded killer.
      - name: baba-in-reach
        when: state.nearest_enemy.kind == 'deku_baba'
              and state.nearest_enemy.dist <= 500
        do:
          - journal baba in reach, engaging
          - goto hunt
      - name: wander-stuck
        on: behavior_done
        where: outcome == 'failure'
        do:
          - journal wander made no net progress, standing watch instead
          - goto stand_watch
      - name: keep-exploring
        on: behavior_done
        do: goto explore_room
  seek_baba:
    behavior: approach_baba_v2
    transitions:
      - name: baba-reached
        on: behavior_done
        where: outcome == 'success'
        do: goto hunt
      - name: seek-failed
        on: behavior_done
        do:
          - journal no baba in the census from here, surveying the room
          - goto survey_room
  # Fourth flight (2026-08-02, MCP-direct): the view-locked census gap.
  # Nothing in this machine turned the view, so the clearing loop starved
  # after kill #1 with live babas at Link's back. survey_room is the
  # looking organ; room-looks-clear is a WAKE because "I looked around
  # and see nothing" is a belief worth the mind's judgment, not a fact.
  # Diagnostic node, fourth flight: reachable only by force_state.
  census_probe:
    behavior: census_probe_v1
    transitions:
      - name: probe-done
        on: behavior_done
        do: goto stand_watch
  # Fifth flight (2026-08-03): mind-side localization against the lab
  # navgraph. Diagnostic node, reachable only by force_state.
  locate_probe:
    behavior: locate_probe_v1
    transitions:
      - name: locate-done
        on: behavior_done
        do: goto stand_watch
  # Sixth flight (2026-08-04): the place-sense acceptance (0.7.0, dojo
  # docs/25 step 6). Diagnostic + mission nodes, entered by force_state.
  probe_refusals:
    behavior: refusal_probe_v1
    transitions:
      - name: refusals-held
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal all three illegal traversals refused before movement
          - goto stand_watch
      - name: refusals-leaked
        on: behavior_done
        do: wake refusal probe FAILED ({detail})
        default: goto stand_watch
  # Sixth flight diagnostic: the spiders' patrol shape, measured, so the
  # climb gate can key on the climb LINE instead of distance-from-Link.
  spider_probe:
    behavior: spider_probe_v1
    transitions:
      - name: probe-read
        on: behavior_done
        do: wake spider probe ({detail})
        default: goto stand_watch
  ascend_3f:
    behavior: ascend_to_3f_v5
    transitions:
      - name: on-3f
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal standing on 3F by two named legs — a floor no flight has reached
          - goto stand_watch
      - name: ascent-failed
        on: behavior_done
        do: wake ascent failed ({detail})
        default: goto stand_watch
  survey_room:
    behavior: survey_room_v1
    transitions:
      - name: baba-sighted
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal survey sighted a baba, seeking it
          - goto seek_baba
      # A full sweep with nothing sighted is the mission's own end
      # condition — go collect. Not a wake any more: the fourth flight's
      # wake existed because "I looked and saw nothing" was a suspicious
      # belief while the wire was lying; with 30/30 on the wire it is
      # ordinary, and freezing the game to announce it wastes the human.
      - name: room-looks-clear
        on: behavior_done
        do:
          # Says BABAS, not "enemies": survey_room_v1 only looks for deku
          # babas, and the first run of this text claimed "sighted no
          # enemies" on a sweep that sighted a skullwalltula — the digest
          # said enemies: 1 while the journal said none. A narration layer
          # that lies in its own journal is the one bug this project cannot
          # afford (fourth flight, caught live).
          - journal full sweep sighted no babas, going for the drop
          - goto fetch_item
  # Fifth flight (2026-08-03): the navgraph mission. Three legs compiled
  # from the lab region graph: vine to the spiral (region 0 -> 2), walk
  # the arc to the chest's stretch, then the fourth flight's charger for
  # the final approach. Entered by force_state; every failure wakes.
  # Free play (2026-08-04): the same leg by NAME — traverse routes on
  # the mesh, so the web hole is unpathable by construction and the
  # start position stops mattering. Entered by force_state; hands off
  # to the fifth flight's ring_walk -> open_chest chain unchanged.
  # Free play 2026-08-04 take two: walk home to the entrance before
  # seeking — the clearing loop starves mid-room (babas out of sight).
  goto_entrance:
    behavior: goto_entrance_v1
    transitions:
      - name: home
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal back at the entrance stretch, seeking babas
          - goto seek_baba
      - name: walk-home-failed
        on: behavior_done
        do: wake walk home failed ({detail})
        default: goto stand_watch
  goto_ring:
    behavior: goto_ring_v1
    transitions:
      - name: ring-reached
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal on the ring by named traverse — walking the arc
          - goto ring_walk
      - name: ring-leg-failed
        on: behavior_done
        do: wake traverse to the ring failed ({detail})
        default: goto stand_watch
  # Free play (2026-08-04), leg two: the 2F door off the ring — the
  # graph's missing edge type, crossed by a body with eyes. Both
  # outcomes wake: the far side is unmapped-by-name and the mind reads
  # oot://place before any next step.
  # Free play (2026-08-04): the bench's first deliberate jump — the 2F
  # walkway gap, measured at ~100 units in the lab mesh. Success chains
  # straight into the door; a miss is a ~400 fall to GF and wakes.
  leap_gap:
    behavior: leap_gap_v1
    transitions:
      - name: over-the-gap
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal across the gap, on the door platform — opening the door
          - goto enter_door
      - name: leap-failed
        on: behavior_done
        do: wake gap leap failed ({detail})
        default: goto stand_watch
  door_census:
    behavior: door_census_v1
    transitions:
      - name: doors-read
        on: behavior_done
        do: wake door map — {detail}
        default: goto stand_watch
  enter_door:
    behavior: enter_door_v1
    transitions:
      - name: through-the-door
        on: behavior_done
        where: outcome == 'success'
        do: wake through the 2F door — new ground; reading the map before moving
        default: goto stand_watch
      - name: door-refused
        on: behavior_done
        do: wake door leg failed ({detail})
        default: goto stand_watch
  climb_vine:
    behavior: goto_vine_v1
    transitions:
      - name: on-the-ring
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal on the spiral walkway (region 2, by the map) — walking the arc
          - goto ring_walk
      - name: vine-failed
        on: behavior_done
        do: wake vine leg failed ({detail})
        default: goto stand_watch
  ring_walk:
    behavior: walk_ring_v1
    transitions:
      - name: chest-in-reach
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal chest near and level — charging
          - goto open_chest
      - name: ring-failed
        on: behavior_done
        do: wake ring walk failed ({detail})
        default: goto stand_watch
  # The vertical leg. Room 0 is a shaft: the chest is +360 up, the doors
  # +400/+800/-320, and only bushes share Link's floor. Everything the
  # mission wants is reached by climbing first.
  climb:
    behavior: climb_ladder_v1
    transitions:
      # Straight to the probe, NOT to a walk. Whatever runs first after a
      # climb decides whether the height survives, and every locomotion
      # body in this repo turns by walking — which on a ledge is a step
      # off it. Measure before moving.
      - name: topped-out
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal climbed — measuring from up here before moving a muscle
          - goto census_probe
      - name: climb-failed
        on: behavior_done
        do: wake could not climb ({detail})
        default: goto stand_watch
  # The chest leg. Success hands control back to the mind deliberately:
  # a message box is open, and reading it is the head's job, not the
  # hands' (SURFACE.md gives the mind dialogue_advance).
  # Fifth flight: charge_chest_v1 reached 45 out, level, and A did not
  # open it — side approach; chests open from the front. v2 trilaterates
  # and comes in from the inward face.
  open_chest:
    behavior: open_chest_v5
    transitions:
      - name: chest-open
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal chest open, message on screen — mind reads it
          - goto stand_watch
      - name: chest-refused
        on: behavior_done
        do: wake could not open the chest ({detail})
        default: goto stand_watch
  # The prize leg: walk into the collectible we can see.
  fetch_item:
    behavior: collect_item_v2
    transitions:
      - name: got-it
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal collected the drop
          - goto stand_watch
      - name: no-drop
        on: behavior_done
        do: wake could not reach the drop ({detail}) — mind's call
        default: goto stand_watch
  hunt:
    behavior: deku_baba_v4
    transitions:
      # The room-clearing loop: kill, then seek the next; ends when seek
      # finds nothing reachable.
      - name: baba-down
        on: behavior_done
        where: outcome == 'success'
        do:
          - journal baba down, seeking the next
          - goto seek_baba
      # Rewired mid-flight: hunt-over used to goto explore_room, but
      # wander_scan_v2 optimizes for open bearings and vetoes bearings
      # toward enemies — in a dungeon room that means "walk out the
      # door, avoiding the mission" (it did, in 3.5s; AJ walked us
      # back). Whiffs now retreat to watch instead.
      - name: hunt-over
        on: behavior_done
        do:
          - journal no kill this pass, standing watch
          - goto stand_watch

transitions:
  - name: novel-actor
    on: spawn
    where: novel == 1
    do: journal first sighting of a {kind}
  - name: unfamiliar-enemy
    when: state.nearest_enemy.kind not in ('deku_baba', 'withered_deku_baba',
          'keese', 'skulltula', 'skullwalltula')
    do: journal unfamiliar enemy in view, outside the official vocabulary
    cooldown_s: 10
  # overhead-lurker removed live 2026-08-01: it keyed on the ceiling
  # skulltula 1080 units up — information a sighted player at floor level
  # does not have (AJ's fairness ruling; see the sharpened X-ray backlog
  # item). It served its test purpose: a live `when` conjunction over a
  # possibly-absent entity, fired and re-armed correctly. Rebuild it only
  # after nearest_enemy is sight-gated.
  # Demoted live 2026-08-01 (second light): waking on every hit froze the
  # game under AJ's hands twice in 21s. Stage-2: ordinary damage journals;
  # the freeze-wake is reserved for genuinely critical health.
  - name: health-critical
    on: damage_taken
    where: hearts_after <= 1.0
    do: wake health critical at {hearts_after} hearts
    default: hold no reflex yet, mind must decide
    cooldown_s: 15
  - name: took-damage
    on: damage_taken
    do: journal took damage, {hearts_after} hearts left
    cooldown_s: 5
